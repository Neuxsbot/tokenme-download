name: Build private TokenMe desktop releases

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Private source tag
        required: true
        default: v4.4.62
      release_tag:
        description: Public download release tag
        required: true
        default: v4.4.62
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SOURCE_TAG: ${{ inputs.source_tag || github.ref_name }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Linux x64
            os: ubuntu-22.04
            args: --bundles appimage,deb

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: Neuxsbot/tokenme-desktop-build
          ref: ${{ env.SOURCE_TAG }}
          token: ${{ secrets.TOKENME_BUILD_REPO_TOKEN }}
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          node --check src/server.js
          node --check public/assets/app.js
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri bundle
        run: npm exec tauri build -- ${{ matrix.args }}

      - name: Stage named release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ env.RELEASE_TAG }}' -replace '^v', ''
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          if ('${{ runner.os }}' -eq 'Windows') {
            $sourceFile = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
            if (-not $sourceFile) { throw 'Windows bundle exe not found' }
            Copy-Item -LiteralPath $sourceFile.FullName -Destination "release-assets/TokenMe-Windows-x64-v$version-绿色版-无需安装.exe"
            Copy-Item -LiteralPath $sourceFile.FullName -Destination "release-assets/TokenMe-Windows-x64-v$version-green-portable.exe"
          } elseif ('${{ runner.os }}' -eq 'macOS') {
            $sourceFile = Get-ChildItem -Path 'src-tauri/target/universal-apple-darwin/release/bundle/dmg' -Filter '*.dmg' -File | Select-Object -First 1
            if (-not $sourceFile) { throw 'macOS dmg not found' }
            Copy-Item -LiteralPath $sourceFile.FullName -Destination "release-assets/TokenMe-macOS-universal-v$version.dmg"
          } else {
            $appImage = Get-ChildItem -Path 'src-tauri/target/release/bundle/appimage' -Filter '*.AppImage' -File | Select-Object -First 1
            $deb = Get-ChildItem -Path 'src-tauri/target/release/bundle/deb' -Filter '*.deb' -File | Select-Object -First 1
            if (-not $appImage) { throw 'Linux AppImage not found' }
            if (-not $deb) { throw 'Linux deb not found' }
            Copy-Item -LiteralPath $appImage.FullName -Destination "release-assets/TokenMe-Linux-x64-v$version.AppImage"
            Copy-Item -LiteralPath $deb.FullName -Destination "release-assets/TokenMe-Linux-x64-v$version.deb"
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tokenme-${{ matrix.name }}-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error

      - name: Upload public release assets
        uses: softprops/action-gh-release@v2
        with:
          repository: Neuxsbot/tokenme-download
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          fail_on_unmatched_files: true
